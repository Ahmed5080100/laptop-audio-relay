<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استقبال صوت الكمبيوتر</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #222;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 2px 12px #0001;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      background: #f1f1f1;
      border-radius: 8px;
      line-height: 1.7;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>استقبال صوت الكمبيوتر</h2>

    <p>
      افتح هذه الصفحة على الهاتف، ثم اضغط على زر الاستقبال.
      اترك الصفحة مفتوحة أثناء المكالمة.
    </p>

    <button id="connect">بدء استقبال الصوت</button>

    <audio id="remoteAudio" autoplay playsinline controls></audio>

    <div id="status">الحالة: جاهز</div>
  </div>

  <script src="receiver.js"></script>
</body>
</html>
