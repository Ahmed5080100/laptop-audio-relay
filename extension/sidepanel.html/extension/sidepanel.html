<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نقل صوت Chrome إلى الهاتف</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      background: #f5f6fa;
      color: #222;
      min-width: 260px;
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
    }

    p {
      font-size: 13px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    #start {
      background: #1769aa;
      color: white;
    }

    #stop {
      background: #ddd;
      color: #222;
    }

    #status {
      margin-top: 12px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>نقل صوت التبويب إلى الهاتف</h2>
  <p>
    افتح صفحة الاستقبال على الهاتف أولاً، ثم افتح تبويب المكالمة على الكمبيوتر
    واضغط بدء الإرسال.
  </p>

  <button id="start">بدء إرسال الصوت</button>
  <button id="stop" disabled>إيقاف الإرسال</button>

  <div id="status">الحالة: جاهز</div>

  <script src="sidepanel.js"></script>
</body>
</html>
